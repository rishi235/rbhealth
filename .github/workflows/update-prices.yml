name: Update prices from Google Sheet

on:
  schedule:
    - cron: "17 * * * *"   # every hour
  workflow_dispatch: {}     # "Run workflow" button for an instant update
  push:
    paths:
      - .github/workflows/update-prices.yml
      - build_prices.py

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Build prices.json
        env:
          # "Publish to web" CSV links for the Sheet's Broadcast and Website Stores tabs
          PRICES_CSV_URL: https://docs.google.com/spreadsheets/d/e/2PACX-1vTH9fEgOXvTWnueIlSmJafTRAjA7ulxbKrS42D074DcRAEQalZgjoAdIc_iHm338x6JBmcrvNt3302Z/pub?gid=1661335109&single=true&output=csv
          STORES_CSV_URL: https://docs.google.com/spreadsheets/d/e/2PACX-1vTH9fEgOXvTWnueIlSmJafTRAjA7ulxbKrS42D074DcRAEQalZgjoAdIc_iHm338x6JBmcrvNt3302Z/pub?gid=2119557095&single=true&output=csv
        run: python build_prices.py "$PRICES_CSV_URL" prices.json "$STORES_CSV_URL"
      - name: Commit if prices changed
        run: |
          if git diff --quiet -- prices.json; then echo "No changes"; exit 0; fi
          git config user.name "price-bot"
          git config user.email "price-bot@users.noreply.github.com"
          git add prices.json
          git commit -m "Update prices from Google Sheet"
          git push
