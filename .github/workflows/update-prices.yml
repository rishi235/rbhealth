name: Update prices from Google Sheet

on:
  schedule:
    - cron: "17 * * * *"   # every hour
  workflow_dispatch: {}     # "Run workflow" button for an instant update

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Build prices.json
        env:
          PRICES_CSV_URL: ${{ vars.PRICES_CSV_URL }}
          STORES_CSV_URL: ${{ vars.STORES_CSV_URL }}
        run: |
          if [ -z "$PRICES_CSV_URL" ]; then echo "PRICES_CSV_URL repository variable is not set yet"; exit 0; fi
          python build_prices.py "$PRICES_CSV_URL" prices.json "${STORES_CSV_URL:-stores-source.csv}"
      - name: Commit if prices changed
        run: |
          if git diff --quiet -- prices.json; then echo "No changes"; exit 0; fi
          git config user.name "price-bot"
          git config user.email "price-bot@users.noreply.github.com"
          git add prices.json
          git commit -m "Update prices from Google Sheet"
          git push
